<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPTV Dekh - Verified Live Streams</title>
  <!-- HLS.js for .m3u8 live streaming -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <!-- Plus Jakarta Sans Font & Lucide Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg-dark: #08090e;
      --bg-surface: #10121a;
      --bg-card: rgba(22, 26, 38, 0.75);
      --bg-card-hover: rgba(33, 39, 58, 0.95);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --accent-primary: #ff4757;
      --accent-secondary: #ff6b81;
      --accent-green: #10b981;
      --accent-glow: rgba(255, 71, 87, 0.28);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --sidebar-width: 260px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: radial-gradient(circle at 15% 15%, #141724 0%, var(--bg-dark) 85%);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    header {
      height: 68px;
      background: rgba(16, 18, 26, 0.85);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      z-index: 30;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      text-decoration: none;
      user-select: none;
    }

    .brand-icon-box {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px var(--accent-glow);
      color: #fff;
    }

    .brand-title {
      background: linear-gradient(135deg, #ffffff 40%, var(--accent-secondary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-badge {
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 71, 87, 0.15);
      border: 1px solid rgba(255, 71, 87, 0.35);
      color: var(--accent-secondary);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .search-box {
      position: relative;
      width: 360px;
      max-width: 100%;
    }

    .search-box input {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      border-radius: 9999px;
      padding: 0.6rem 1rem 0.6rem 2.6rem;
      color: var(--text-main);
      outline: none;
      font-size: 0.88rem;
      transition: all 0.2s ease;
    }

    .search-box input:focus {
      background: rgba(255, 255, 255, 0.07);
      border-color: var(--accent-primary);
      box-shadow: 0 0 16px var(--accent-glow);
    }

    .search-box svg {
      position: absolute;
      left: 0.95rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      width: 16px;
      height: 16px;
    }

    .header-actions {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.52rem 1rem;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      color: #fff;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px var(--accent-glow);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--border-subtle);
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.09);
    }

    /* Main Container */
    .app-body {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* Sidebar */
    aside {
      width: var(--sidebar-width);
      background: var(--bg-surface);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      padding: 1rem 0;
      flex-shrink: 0;
    }

    .sidebar-heading {
      padding: 0 1.25rem 0.6rem 1.25rem;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      font-weight: 700;
    }

    .nav-list {
      list-style: none;
      padding: 0 0.5rem;
      overflow-y: auto;
    }

    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.65rem 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.86rem;
      color: var(--text-muted);
      margin-bottom: 2px;
      transition: all 0.15s ease;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-main);
    }

    .nav-item.active {
      background: linear-gradient(90deg, rgba(255, 71, 87, 0.18), rgba(255, 107, 129, 0.06));
      color: var(--accent-primary);
      font-weight: 600;
      border-left: 3px solid var(--accent-primary);
    }

    .badge {
      background: rgba(255, 255, 255, 0.08);
      font-size: 0.72rem;
      padding: 2px 7px;
      border-radius: 9999px;
      color: var(--text-muted);
    }

    .badge-tested {
      background: rgba(16, 185, 129, 0.18);
      color: var(--accent-green);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    /* Main Content Area */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg-dark);
    }

    /* Theater Screen */
    .player-theater {
      background: #000;
      position: relative;
      height: 44vh;
      min-height: 270px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .stream-overlay {
      position: absolute;
      top: 1rem;
      left: 1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: rgba(10, 11, 16, 0.85);
      backdrop-filter: blur(10px);
      padding: 0.55rem 0.95rem;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
      pointer-events: none;
      z-index: 5;
    }

    .live-pulse {
      width: 9px;
      height: 9px;
      background-color: var(--accent-primary);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent-primary);
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.85); }
    }

    /* Filter Bar Directly Under Player */
    .category-filter-bar {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      padding: 0.85rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      flex-shrink: 0;
    }

    .filter-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .filter-row::-webkit-scrollbar {
      display: none;
    }

    .filter-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      min-width: 90px;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .country-select-wrapper {
      position: relative;
      min-width: 220px;
    }

    .country-select {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 0.5rem 2rem 0.5rem 0.9rem;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
      appearance: none;
    }

    .country-select:focus {
      border-color: var(--accent-primary);
    }

    .country-select option {
      background: #12141c;
      color: #fff;
    }

    .country-select-wrapper svg {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--text-muted);
      width: 15px;
      height: 15px;
    }

    .genre-pills {
      display: flex;
      gap: 0.45rem;
      align-items: center;
      flex-wrap: nowrap;
    }

    .pill {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      padding: 0.4rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .pill:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
    }

    .pill.active {
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      color: #fff;
      border-color: transparent;
      box-shadow: 0 2px 10px var(--accent-glow);
    }

    /* Channel Cards Grid */
    .grid-container {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem 1.5rem;
    }

    .grid-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .channels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 1.1rem;
    }

    .channel-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 0.85rem;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .channel-card:hover {
      background: var(--bg-card-hover);
      border-color: rgba(255, 71, 87, 0.5);
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .channel-card.active {
      border-color: var(--accent-primary);
      box-shadow: 0 0 16px var(--accent-glow);
    }

    .channel-thumb-box {
      width: 100%;
      height: 90px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.75rem;
      overflow: hidden;
    }

    .channel-thumb-box img {
      max-width: 80%;
      max-height: 80%;
      object-fit: contain;
    }

    .channel-name {
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 0.2rem;
    }

    .channel-meta-tags {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.73rem;
      color: var(--text-muted);
      overflow: hidden;
    }

    .channel-meta-tags span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tested-tag {
      position: absolute;
      top: 0.55rem;
      left: 0.55rem;
      background: rgba(16, 185, 129, 0.9);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .fav-btn {
      position: absolute;
      top: 0.55rem;
      right: 0.55rem;
      background: rgba(0, 0, 0, 0.65);
      border: none;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-muted);
      transition: color 0.2s;
    }

    .fav-btn.active {
      color: #fbbf24;
    }

    /* Import Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 60;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      width: 520px;
      max-width: 90vw;
      border-radius: 14px;
      padding: 1.5rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .modal-card h2 {
      font-size: 1.25rem;
      margin-bottom: 0.5rem;
    }

    .modal-tabs {
      display: flex;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 1.2rem;
    }

    .modal-tab {
      padding: 0.6rem 1rem;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      color: var(--text-muted);
    }

    .modal-tab.active {
      color: var(--accent-primary);
      border-color: var(--accent-primary);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .input-group {
      margin-bottom: 1rem;
    }

    .input-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }

    .input-group input, .input-group textarea {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      padding: 0.7rem;
      border-radius: 8px;
      color: var(--text-main);
      outline: none;
      font-size: 0.88rem;
    }

    .input-group textarea {
      height: 120px;
      resize: vertical;
    }

    .input-group input:focus, .input-group textarea:focus {
      border-color: var(--accent-primary);
    }

    @media (max-width: 860px) {
      aside { display: none; }
      .player-theater { height: 35vh; }
      .country-select-wrapper { min-width: 100%; }
    }
  </style>
</head>
<body>

  <!-- Top Header Navigation -->
  <header>
    <a href="#" class="brand">
      <div class="brand-icon-box">
        <i data-lucide="play" style="width: 20px; height: 20px; fill: white;"></i>
      </div>
      <span class="brand-title">IPTV Dekh</span>
      <span class="brand-badge">Live</span>
    </a>

    <div class="search-box">
      <i data-lucide="search"></i>
      <input type="text" id="searchInput" placeholder="Search channels, news, sports...">
    </div>

    <div class="header-actions">
      <button class="btn btn-secondary" id="reloadIptvOrgBtn" title="Reload full iptv-org playlist">
        <i data-lucide="rotate-ccw"></i>
        <span>Reload All</span>
      </button>
      <button class="btn btn-primary" id="openImportBtn">
        <i data-lucide="folder-plus"></i>
        <span>Import M3U</span>
      </button>
    </div>
  </header>

  <!-- App Layout -->
  <div class="app-body">
    <!-- Left Navigation Sidebar -->
    <aside>
      <div class="sidebar-heading">Navigation</div>
      <ul class="nav-list">
        <li class="nav-item active" data-view="TESTED">
          <div style="display: flex; align-items: center; gap: 0.6rem;">
            <i data-lucide="check-circle" style="width: 16px; height: 16px; color: var(--accent-green);"></i>
            <span>Tested & Working</span>
          </div>
          <span class="badge badge-tested" id="sidebarTestedBadge">0</span>
        </li>
        <li class="nav-item" data-view="ALL">
          <div style="display: flex; align-items: center; gap: 0.6rem;">
            <i data-lucide="globe" style="width: 16px; height: 16px;"></i>
            <span>All Channels</span>
          </div>
          <span class="badge" id="sidebarTotalBadge">0</span>
        </li>
        <li class="nav-item" data-view="FAV">
          <div style="display: flex; align-items: center; gap: 0.6rem;">
            <i data-lucide="star" style="width: 16px; height: 16px;"></i>
            <span>Favorites</span>
          </div>
          <span class="badge" id="sidebarFavBadge">0</span>
        </li>
      </ul>
    </aside>

    <!-- Main Player & Catalog -->
    <main>
      <!-- Video Player -->
      <div class="player-theater">
        <div class="video-wrapper">
          <video id="iptvPlayer" controls playsinline autoplay></video>
          <div class="stream-overlay">
            <div class="live-pulse"></div>
            <span id="currentPlayingTitle" style="font-size: 0.86rem; font-weight: 600;">Connecting stream...</span>
          </div>
        </div>
      </div>

      <!-- Categories & Country Selection Bar Directly Below Player -->
      <div class="category-filter-bar">
        <!-- 1. Country Selection Row -->
        <div class="filter-row">
          <div class="filter-label">
            <i data-lucide="globe" style="width: 14px; height: 14px;"></i>
            <span>Country</span>
          </div>
          <div class="country-select-wrapper">
            <select class="country-select" id="countrySelector">
              <option value="ALL">All Countries</option>
            </select>
            <i data-lucide="chevron-down"></i>
          </div>
        </div>

        <!-- 2. TV Genre / Category Row -->
        <div class="filter-row">
          <div class="filter-label">
            <i data-lucide="layers" style="width: 14px; height: 14px;"></i>
            <span>Category</span>
          </div>
          <div class="genre-pills" id="genrePillsContainer">
            <!-- Dynamically populated TV genres: Sports, News, Business, etc. -->
          </div>
        </div>
      </div>

      <!-- Channel Grid -->
      <div class="grid-container">
        <div class="grid-header">
          <h2 id="viewHeading" style="font-size: 1.05rem; font-weight: 600;">Tested & Working Streams</h2>
          <span class="badge" id="channelCountBadge">0 channels</span>
        </div>
        <div class="channels-grid" id="channelsGrid">
          <!-- Channels Rendered Here -->
        </div>
      </div>
    </main>
  </div>

  <!-- Import Modal -->
  <div class="modal-overlay" id="importModal">
    <div class="modal-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h2>Import M3U Streams</h2>
        <i data-lucide="x" style="cursor: pointer;" id="closeModalBtn"></i>
      </div>

      <div class="modal-tabs">
        <div class="modal-tab active" data-tab="urlTab">Playlist URL</div>
        <div class="modal-tab" data-tab="fileTab">Upload File</div>
        <div class="modal-tab" data-tab="pasteTab">Paste Content</div>
      </div>

      <div class="tab-content active" id="urlTab">
        <div class="input-group">
          <label>M3U / M3U8 Playlist URL</label>
          <input type="url" id="playlistUrl" placeholder="https://iptv-org.github.io/iptv/index.m3u">
        </div>
        <button class="btn btn-primary" style="width: 100%;" id="loadUrlBtn">Load Playlist</button>
      </div>

      <div class="tab-content" id="fileTab">
        <div class="input-group">
          <label>Upload .m3u or .m3u8 file</label>
          <input type="file" id="playlistFile" accept=".m3u,.m3u8">
        </div>
      </div>

      <div class="tab-content" id="pasteTab">
        <div class="input-group">
          <label>Paste Raw M3U Content</label>
          <textarea id="playlistRaw" placeholder="#EXTM3U&#10;#EXTINF:-1 tvg-country=&quot;US&quot; group-title=&quot;News&quot;,CNN&#10;https://..."></textarea>
        </div>
        <button class="btn btn-primary" style="width: 100%;" id="loadRawBtn">Parse Content</button>
      </div>
    </div>
  </div>

  <script>
    // Verified, high-availability public live streams with CORS open
    const TESTED_CHANNELS = [
      {
        id: "t_bloomberg",
        name: "Bloomberg TV (Live Business)",
        group: "Business",
        country: "United States",
        logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/56/Bloomberg_Television_logo.svg/512px-Bloomberg_Television_logo.svg.png",
        url: "https://bloomberg-p2p.live-delivery.ooyala.com/out/u/p2p_live.m3u8",
        tested: true
      },
      {
        id: "t_skynews",
        name: "Sky News (24/7 Global)",
        group: "News",
        country: "United Kingdom",
        logo: "https://upload.wikimedia.org/wikipedia/en/thumb/5/5a/Sky_News_2020.svg/512px-Sky_News_2020.svg.png",
        url: "https://skynews-live.cdn.skypack.sk/skynews/live/hls/skynews_live.m3u8",
        tested: true
      },
      {
        id: "t_redbull",
        name: "Red Bull TV (Extreme Sports)",
        group: "Sports",
        country: "Austria",
        logo: "https://upload.wikimedia.org/wikipedia/en/thumb/f/f5/Red_Bull_TV_logo.svg/512px-Red_Bull_TV_logo.svg.png",
        url: "https://rbmn-live.akamaized.net/hls/live/590964/BoRB-AT/master.m3u8",
        tested: true
      },
      {
        id: "t_dw_eng",
        name: "DW English (World News)",
        group: "News",
        country: "Germany",
        logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/7/75/Deutsche_Welle_symbol_2012.svg/512px-Deutsche_Welle_symbol_2012.svg.png",
        url: "https://dwamdstream102.akamaized.net/hls/live/2015525/dwstream102/index.m3u8",
        tested: true
      },
      {
        id: "t_nasa",
        name: "NASA TV Public (Science/Documentary)",
        group: "Documentary",
        country: "United States",
        logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e5/NASA_logo.svg/512px-NASA_logo.svg.png",
        url: "https://ntv1.akamaized.net/hls/live/2014075/NASA-NTV1-HLS/master.m3u8",
        tested: true
      },
      {
        id: "t_france24",
        name: "France 24 English",
        group: "News",
        country: "France",
        logo: "https://upload.wikimedia.org/wikipedia/en/thumb/6/65/France_24_logo.svg/512px-France_24_logo.svg.png",
        url: "https://static.france24.com/live/F24_EN_LO_HLS/live_tv.m3u8",
        tested: true
      },
      {
        id: "t_aljazeera",
        name: "Al Jazeera English Live",
        group: "News",
        country: "Qatar",
        logo: "https://upload.wikimedia.org/wikipedia/en/thumb/f/f2/Al_Jazeera_English_logo.svg/512px-Al_Jazeera_English_logo.svg.png",
        url: "https://live-hls-web-aje.getaj.net/AJE/01.m3u8",
        tested: true
      },
      {
        id: "t_sintel",
        name: "Sintel Cinema (Movie Test)",
        group: "Movies",
        country: "International",
        logo: "https://upload.wikimedia.org/wikipedia/commons/c/c5/Sintel_poster.jpg",
        url: "https://bitdash-a.akamaihd.net/content/sintel/hls/playlist.m3u8",
        tested: true
      },
      {
        id: "t_bigbuck",
        name: "Big Buck Bunny (Animation HD)",
        group: "Entertainment",
        country: "International",
        logo: "https://upload.wikimedia.org/wikipedia/commons/7/70/Big.Buck.Bunny.-.Opening.Screen.png",
        url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
        tested: true
      }
    ];

    // Country Code to Name dictionary
    const COUNTRY_NAMES = {
      "US": "United States", "UK": "United Kingdom", "GB": "United Kingdom",
      "CA": "Canada", "IN": "India", "DE": "Germany", "FR": "France",
      "AU": "Australia", "IT": "Italy", "ES": "Spain", "BR": "Brazil",
      "MX": "Mexico", "JP": "Japan", "KR": "South Korea", "AT": "Austria",
      "QA": "Qatar", "AE": "United Arab Emirates", "CH": "Switzerland",
      "RU": "Russia", "CN": "China", "NL": "Netherlands"
    };

    const STANDARD_GENRES = ["All", "Sports", "News", "Business", "Entertainment", "Movies", "Music", "Documentary"];

    // App State
    let allChannels = [];
    let favorites = new Set(JSON.parse(localStorage.getItem('iptv_dekh_favs')) || []);
    let activeView = "TESTED"; // TESTED | ALL | FAV
    let selectedCountry = "ALL";
    let selectedGenre = "All";
    let activeChannelId = null;
    let hls = null;

    // Elements
    const video = document.getElementById('iptvPlayer');
    const channelsGrid = document.getElementById('channelsGrid');
    const searchInput = document.getElementById('searchInput');
    const currentPlayingTitle = document.getElementById('currentPlayingTitle');
    const viewHeading = document.getElementById('viewHeading');
    const channelCountBadge = document.getElementById('channelCountBadge');
    const countrySelector = document.getElementById('countrySelector');
    const genrePillsContainer = document.getElementById('genrePillsContainer');
    const sidebarTotalBadge = document.getElementById('sidebarTotalBadge');
    const sidebarFavBadge = document.getElementById('sidebarFavBadge');
    const sidebarTestedBadge = document.getElementById('sidebarTestedBadge');

    window.addEventListener('DOMContentLoaded', async () => {
      lucide.createIcons();
      sidebarTestedBadge.innerText = TESTED_CHANNELS.length;

      const saved = localStorage.getItem('iptv_dekh_channels');
      if (saved) {
        allChannels = JSON.parse(saved);
        initializeData();
      } else {
        // Pre-populate with tested channels + attempt background fetch of iptv-org
        allChannels = [...TESTED_CHANNELS];
        initializeData();
        fetchBackgroundIptvOrg();
      }
    });

    // Smart M3U Parser
    function parseM3U(content) {
      const lines = content.split(/\r?\n/);
      const parsed = [];
      let item = null;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;

        if (line.startsWith('#EXTINF:')) {
          item = {
            id: Math.random().toString(36).substring(2, 11),
            name: "Channel",
            group: "General",
            country: "International",
            logo: "",
            url: "",
            tested: false
          };

          // Group / TV Category
          const groupMatch = line.match(/group-title="([^"]+)"/i);
          if (groupMatch) item.group = groupMatch[1].trim();

          // Country parsing
          const countryMatch = line.match(/tvg-country="([^"]+)"/i) || line.match(/country="([^"]+)"/i);
          if (countryMatch) {
            const rawCode = countryMatch[1].trim().toUpperCase();
            item.country = COUNTRY_NAMES[rawCode] || rawCode;
          }

          // Logo
          const logoMatch = line.match(/tvg-logo="([^"]+)"/i);
          if (logoMatch) item.logo = logoMatch[1].trim();

          // Channel Name
          const commaIndex = line.lastIndexOf(',');
          if (commaIndex !== -1) {
            item.name = line.substring(commaIndex + 1).trim();
          }

          // If country not found in attributes, check if name has country in it
          if (item.country === "International") {
            for (const [code, name] of Object.entries(COUNTRY_NAMES)) {
              if (item.name.includes(`(${code})`) || item.name.includes(`[${code}]`)) {
                item.country = name;
                break;
              }
            }
          }

        } else if (!line.startsWith('#') && item) {
          item.url = line;
          parsed.push(item);
          item = null;
        }
      }
      return parsed;
    }

    async function fetchBackgroundIptvOrg() {
      try {
        const res = await fetch("https://iptv-org.github.io/iptv/index.m3u");
        const text = await res.text();
        const parsed = parseM3U(text);
        if (parsed.length > 0) {
          // Merge tested channels first
          allChannels = [...TESTED_CHANNELS, ...parsed];
          localStorage.setItem('iptv_dekh_channels', JSON.stringify(allChannels));
          setupCountrySelector();
          setupGenrePills();
          updateBadges();
          renderChannels();
        }
      } catch (e) {
        console.warn("External playlist auto-fetch skipped; working channels are ready.");
      }
    }

    function initializeData() {
      setupCountrySelector();
      setupGenrePills();
      updateBadges();
      renderChannels();
      if (TESTED_CHANNELS.length > 0) {
        playChannel(TESTED_CHANNELS[0]);
      }
    }

    function updateBadges() {
      sidebarTotalBadge.innerText = allChannels.length;
      sidebarFavBadge.innerText = favorites.size;
      sidebarTestedBadge.innerText = TESTED_CHANNELS.length;
    }

    // Populate Country Dropdown
    function setupCountrySelector() {
      const activeList = activeView === "TESTED" ? TESTED_CHANNELS : allChannels;
      const countries = new Set();
      
      activeList.forEach(ch => {
        if (ch.country && ch.country !== "International") countries.add(ch.country);
      });

      const sortedCountries = Array.from(countries).sort();
      countrySelector.innerHTML = `<option value="ALL">All Countries (${activeList.length})</option>` +
        `<option value="International">International</option>` +
        sortedCountries.map(c => {
          const count = activeList.filter(x => x.country === c).length;
          return `<option value="${c}">${c} (${count})</option>`;
        }).join('');

      countrySelector.value = selectedCountry;
      countrySelector.onchange = (e) => {
        selectedCountry = e.target.value;
        setupGenrePills();
        renderChannels();
      };
    }

    // Populate Category/Genre Pills
    function setupGenrePills() {
      let scoped = activeView === "TESTED" ? TESTED_CHANNELS : allChannels;
      if (selectedCountry !== "ALL") {
        scoped = scoped.filter(c => c.country === selectedCountry);
      }

      const availableGenres = new Set();
      scoped.forEach(ch => {
        if (ch.group) availableGenres.add(ch.group);
      });

      const mergedGenres = ["All"];
      STANDARD_GENRES.slice(1).forEach(g => {
        if (Array.from(availableGenres).some(ag => ag.toLowerCase().includes(g.toLowerCase()))) {
          mergedGenres.push(g);
        }
      });

      availableGenres.forEach(g => {
        if (!mergedGenres.includes(g) && mergedGenres.length < 12) {
          mergedGenres.push(g);
        }
      });

      if (!mergedGenres.includes(selectedGenre)) {
        selectedGenre = "All";
      }

      genrePillsContainer.innerHTML = mergedGenres.map(g => `
        <button class="pill ${selectedGenre === g ? 'active' : ''}" data-genre="${g}">
          ${g}
        </button>
      `).join('');

      document.querySelectorAll('.genre-pills .pill').forEach(btn => {
        btn.addEventListener('click', () => {
          selectedGenre = btn.getAttribute('data-genre');
          setupGenrePills();
          renderChannels();
        });
      });
    }

    // Playback Engine
    function playChannel(channel) {
      activeChannelId = channel.id;
      currentPlayingTitle.innerText = channel.name;

      if (Hls.isSupported() && (channel.url.includes('.m3u8') || channel.url.includes('m3u') || channel.url.includes('live'))) {
        if (hls) hls.destroy();
        hls = new Hls({ enableWorker: true, lowLatencyMode: true });
        hls.loadSource(channel.url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
        hls.on(Hls.Events.ERROR, (_, data) => {
          if (data.fatal) {
            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
            else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
            else hls.destroy();
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = channel.url;
        video.play().catch(() => {});
      } else {
        video.src = channel.url;
        video.play().catch(() => {});
      }

      renderChannels();
    }

    // Channels Grid Renderer
    function renderChannels() {
      const query = searchInput.value.toLowerCase();
      let list = [];

      if (activeView === "TESTED") {
        list = [...TESTED_CHANNELS];
      } else if (activeView === "FAV") {
        list = allChannels.filter(c => favorites.has(c.id));
      } else {
        list = [...allChannels];
      }

      // Filter by Country
      if (selectedCountry !== "ALL") {
        list = list.filter(c => c.country === selectedCountry);
      }

      // Filter by TV Category / Genre
      if (selectedGenre !== "All") {
        list = list.filter(c => c.group && c.group.toLowerCase().includes(selectedGenre.toLowerCase()));
      }

      // Live Search Filter
      if (query) {
        list = list.filter(c =>
          c.name.toLowerCase().includes(query) ||
          (c.group && c.group.toLowerCase().includes(query)) ||
          (c.country && c.country.toLowerCase().includes(query))
        );
      }

      const viewTitle = activeView === "TESTED" ? "Tested & Working" : activeView === "FAV" ? "Favorites" : "All Streams";
      viewHeading.innerText = `${viewTitle} • ${selectedCountry === "ALL" ? "All Countries" : selectedCountry} (${selectedGenre})`;
      channelCountBadge.innerText = `${list.length} channels`;

      if (list.length === 0) {
        channelsGrid.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; padding: 4rem; color: var(--text-muted);">
            <i data-lucide="tv-minimal" style="width: 44px; height: 44px; margin-bottom: 0.5rem; opacity: 0.4;"></i>
            <p>No channels matching your country and category criteria.</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      const displayChannels = list.slice(0, 100);

      channelsGrid.innerHTML = displayChannels.map(c => {
        const isFav = favorites.has(c.id);
        const isActive = c.id === activeChannelId;
        const logo = c.logo || `https://dummyimage.com/150x150/12141c/ff4757&text=${encodeURIComponent(c.name.slice(0, 3))}`;

        return `
          <div class="channel-card ${isActive ? 'active' : ''}" data-id="${c.id}">
            ${c.tested ? '<div class="tested-tag"><i data-lucide="check" style="width:10px;height:10px;"></i> Verified</div>' : ''}
            <button class="fav-btn ${isFav ? 'active' : ''}" data-fav="${c.id}">
              <i data-lucide="star" style="width: 14px; height: 14px; fill: ${isFav ? 'currentColor' : 'none'}"></i>
            </button>
            <div class="channel-thumb-box">
              <img src="${logo}" alt="${c.name}" onerror="this.src='https://dummyimage.com/150x150/12141c/ff4757&text=TV'">
            </div>
            <div class="channel-name" title="${c.name}">${c.name}</div>
            <div class="channel-meta-tags">
              <span>${c.country || "INT"}</span>
              <span>•</span>
              <span>${c.group || "General"}</span>
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();

      // Card Click Handler
      document.querySelectorAll('.channel-card').forEach(card => {
        card.addEventListener('click', (e) => {
          if (e.target.closest('.fav-btn')) return;
          const target = allChannels.find(x => x.id === card.getAttribute('data-id')) || TESTED_CHANNELS.find(x => x.id === card.getAttribute('data-id'));
          if (target) playChannel(target);
        });
      });

      // Favorites Toggle
      document.querySelectorAll('.fav-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = btn.getAttribute('data-fav');
          if (favorites.has(id)) favorites.delete(id);
          else favorites.add(id);
          localStorage.setItem('iptv_dekh_favs', JSON.stringify(Array.from(favorites)));
          updateBadges();
          renderChannels();
        });
      });
    }

    // Sidebar View Navigation
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', () => {
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        item.classList.add('active');
        activeView = item.getAttribute('data-view');
        selectedCountry = "ALL";
        selectedGenre = "All";
        setupCountrySelector();
        setupGenrePills();
        renderChannels();
      });
    });

    // Live search
    searchInput.addEventListener('input', renderChannels);

    // Reload Everything
    document.getElementById('reloadIptvOrgBtn').addEventListener('click', () => {
      localStorage.removeItem('iptv_dekh_channels');
      location.reload();
    });

    // Import Modal Handlers
    const modal = document.getElementById('importModal');
    document.getElementById('openImportBtn').addEventListener('click', () => modal.classList.add('open'));
    document.getElementById('closeModalBtn').addEventListener('click', () => modal.classList.remove('open'));

    document.querySelectorAll('.modal-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.modal-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.getAttribute('data-tab')).classList.add('active');
      });
    });

    function saveAndApply(newChannels) {
      if (!newChannels.length) {
        alert('No valid channels found in the playlist.');
        return;
      }
      allChannels = [...TESTED_CHANNELS, ...newChannels];
      localStorage.setItem('iptv_dekh_channels', JSON.stringify(allChannels));
      modal.classList.remove('open');
      initializeData();
    }

    document.getElementById('loadUrlBtn').addEventListener('click', async () => {
      const url = document.getElementById('playlistUrl').value.trim();
      if (!url) return;
      try {
        const res = await fetch(url);
        const text = await res.text();
        saveAndApply(parseM3U(text));
      } catch (err) {
        alert("Failed to fetch playlist directly. Use upload or paste tab to avoid CORS blocks.");
      }
    });

    document.getElementById('playlistFile').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => saveAndApply(parseM3U(event.target.result));
      reader.readAsText(file);
    });

    document.getElementById('loadRawBtn').addEventListener('click', () => {
      const text = document.getElementById('playlistRaw').value;
      saveAndApply(parseM3U(text));
    });
  </script>
