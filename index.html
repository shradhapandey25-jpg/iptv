<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPTV Dekh Player</title>
  <!-- HLS.js for .m3u8 live streaming -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <!-- Fonts & Lucide Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg-dark: #0a0b10;
      --bg-surface: #12141c;
      --bg-card: rgba(26, 29, 43, 0.7);
      --bg-card-hover: rgba(38, 43, 64, 0.85);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --accent-cyan: #00f2fe;
      --accent-indigo: #4facfe;
      --accent-glow: rgba(0, 242, 254, 0.25);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --danger: #ef4444;
      --sidebar-width: 270px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: radial-gradient(circle at 10% 20%, #111322 0%, var(--bg-dark) 90%);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Navigation */
    header {
      height: 70px;
      background: rgba(18, 20, 28, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-indigo));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      user-select: none;
    }

    .search-container {
      position: relative;
      width: 380px;
      max-width: 100%;
    }

    .search-container input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      border-radius: 9999px;
      padding: 0.6rem 1rem 0.6rem 2.6rem;
      color: var(--text-main);
      outline: none;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .search-container input:focus {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--accent-cyan);
      box-shadow: 0 0 16px var(--accent-glow);
    }

    .search-container svg {
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      width: 17px;
      height: 17px;
    }

    .header-actions {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.55rem 1rem;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-indigo));
      color: #060913;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px var(--accent-glow);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--border-subtle);
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    /* Main Workspace */
    .app-body {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* Sidebar Categories */
    aside {
      width: var(--sidebar-width);
      background: var(--bg-surface);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      padding: 1rem 0;
    }

    .sidebar-header {
      padding: 0 1.25rem 0.75rem 1.25rem;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      font-weight: 700;
    }

    .category-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
      padding: 0 0.5rem;
    }

    .category-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.65rem 0.85rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.86rem;
      color: var(--text-muted);
      transition: all 0.15s ease;
      margin-bottom: 2px;
    }

    .category-item:hover {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-main);
    }

    .category-item.active {
      background: linear-gradient(90deg, rgba(0, 242, 254, 0.15), rgba(79, 172, 254, 0.05));
      color: var(--accent-cyan);
      font-weight: 600;
      border-left: 3px solid var(--accent-cyan);
    }

    .badge {
      background: rgba(255, 255, 255, 0.08);
      font-size: 0.72rem;
      padding: 2px 7px;
      border-radius: 9999px;
      color: var(--text-muted);
    }

    /* Video Player Arena */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg-dark);
    }

    .player-theater {
      background: #000;
      position: relative;
      height: 48vh;
      min-height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--border-subtle);
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .player-overlay {
      position: absolute;
      top: 1rem;
      left: 1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: rgba(10, 11, 16, 0.75);
      backdrop-filter: blur(8px);
      padding: 0.5rem 0.9rem;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      pointer-events: none;
      z-index: 5;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background-color: var(--danger);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--danger);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* Channel Grid */
    .grid-container {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
    }

    .grid-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .channels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 1.1rem;
    }

    .channel-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 0.9rem;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .channel-card:hover {
      background: var(--bg-card-hover);
      border-color: rgba(0, 242, 254, 0.4);
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .channel-card.active {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 16px var(--accent-glow);
    }

    .channel-thumb-box {
      width: 100%;
      height: 95px;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.75rem;
      overflow: hidden;
    }

    .channel-thumb-box img {
      max-width: 80%;
      max-height: 80%;
      object-fit: contain;
    }

    .channel-name {
      font-size: 0.92rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 0.25rem;
    }

    .channel-group {
      font-size: 0.75rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .fav-btn {
      position: absolute;
      top: 0.6rem;
      right: 0.6rem;
      background: rgba(0, 0, 0, 0.5);
      border: none;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-muted);
      transition: color 0.2s;
    }

    .fav-btn.active {
      color: #fbbf24;
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      width: 520px;
      max-width: 90vw;
      border-radius: 14px;
      padding: 1.5rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .modal-card h2 {
      font-size: 1.25rem;
      margin-bottom: 0.5rem;
    }

    .modal-tabs {
      display: flex;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 1.2rem;
    }

    .modal-tab {
      padding: 0.6rem 1rem;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      color: var(--text-muted);
    }

    .modal-tab.active {
      color: var(--accent-cyan);
      border-color: var(--accent-cyan);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .input-group {
      margin-bottom: 1rem;
    }

    .input-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }

    .input-group input, .input-group textarea {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      padding: 0.7rem;
      border-radius: 8px;
      color: var(--text-main);
      outline: none;
      font-size: 0.88rem;
    }

    .input-group textarea {
      height: 120px;
      resize: vertical;
    }

    .input-group input:focus, .input-group textarea:focus {
      border-color: var(--accent-cyan);
    }

    /* Loading Spinner */
    .loading-indicator {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 4rem;
      color: var(--text-muted);
    }

    @media (max-width: 768px) {
      aside { display: none; }
      .player-theater { height: 35vh; }
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <header>
    <div class="brand">
      <i data-lucide="tv"></i>
      <span>AETHER IPTV</span>
    </div>

    <div class="search-container">
      <i data-lucide="search"></i>
      <input type="text" id="searchInput" placeholder="Search channels, genres, categories...">
    </div>

    <div class="header-actions">
      <button class="btn btn-secondary" id="resetIptvOrgBtn" title="Reset to iptv-org catalog">
        <i data-lucide="rotate-ccw"></i>
        <span>Reload iptv-org</span>
      </button>
      <button class="btn btn-primary" id="openImportBtn">
        <i data-lucide="plus-circle"></i>
        <span>Import M3U</span>
      </button>
    </div>
  </header>

  <!-- App Interface -->
  <div class="app-body">
    <!-- Sidebar Categories -->
    <aside>
      <div class="sidebar-header">Categories</div>
      <ul class="category-list" id="categoryList">
        <!-- Rendered by JS -->
      </ul>
    </aside>

    <!-- Player & Stream Grid -->
    <main>
      <div class="player-theater">
        <div class="video-wrapper">
          <video id="iptvPlayer" controls playsinline autoplay></video>
          <div class="player-overlay" id="playerOverlay">
            <div class="live-dot"></div>
            <span id="currentPlayingName" style="font-size: 0.85rem; font-weight: 600;">Loading stream...</span>
          </div>
        </div>
      </div>

      <div class="grid-container">
        <div class="grid-header">
          <h2 id="activeCategoryTitle" style="font-size: 1.1rem; font-weight: 600;">All Channels</h2>
          <span class="badge" id="channelCountBadge">0 channels</span>
        </div>
        <div class="channels-grid" id="channelsGrid">
          <!-- Rendered Channels -->
        </div>
      </div>
    </main>
  </div>

  <!-- Import Modal -->
  <div class="modal-overlay" id="importModal">
    <div class="modal-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h2>Import Custom Playlist</h2>
        <i data-lucide="x" style="cursor: pointer;" id="closeModalBtn"></i>
      </div>

      <div class="modal-tabs">
        <div class="modal-tab active" data-tab="urlTab">Playlist URL</div>
        <div class="modal-tab" data-tab="fileTab">Upload File</div>
        <div class="modal-tab" data-tab="pasteTab">Paste Content</div>
      </div>

      <div class="tab-content active" id="urlTab">
        <div class="input-group">
          <label>M3U / M3U8 Playlist URL</label>
          <input type="url" id="playlistUrl" placeholder="https://iptv-org.github.io/iptv/index.m3u">
        </div>
        <button class="btn btn-primary" style="width: 100%;" id="loadUrlBtn">Load Playlist</button>
      </div>

      <div class="tab-content" id="fileTab">
        <div class="input-group">
          <label>Upload .m3u or .m3u8 file</label>
          <input type="file" id="playlistFile" accept=".m3u,.m3u8">
        </div>
      </div>

      <div class="tab-content" id="pasteTab">
        <div class="input-group">
          <label>Paste M3U Raw Text</label>
          <textarea id="playlistRaw" placeholder="#EXTM3U&#10;#EXTINF:-1 tvg-logo=&quot;...&quot; group-title=&quot;News&quot;,Channel Name&#10;https://..."></textarea>
        </div>
        <button class="btn btn-primary" style="width: 100%;" id="loadRawBtn">Parse Content</button>
      </div>
    </div>
  </div>

  <script>
    // Primary iptv-org raw stream index
    const IPTV_ORG_URL = "https://iptv-org.github.io/iptv/index.m3u";

    // App State
    let channels = [];
    let favorites = new Set(JSON.parse(localStorage.getItem('aether_favs')) || []);
    let currentCategory = "ALL";
    let activeChannelId = null;
    let hls = null;

    // DOM Elements
    const video = document.getElementById('iptvPlayer');
    const categoryList = document.getElementById('categoryList');
    const channelsGrid = document.getElementById('channelsGrid');
    const searchInput = document.getElementById('searchInput');
    const currentPlayingName = document.getElementById('currentPlayingName');
    const activeCategoryTitle = document.getElementById('activeCategoryTitle');
    const channelCountBadge = document.getElementById('channelCountBadge');

    window.addEventListener('DOMContentLoaded', async () => {
      lucide.createIcons();
      const saved = localStorage.getItem('aether_channels');
      if (saved) {
        channels = JSON.parse(saved);
        initializeUI();
      } else {
        await fetchAndLoadPlaylist(IPTV_ORG_URL);
      }
    });

    // M3U Stream Parser
    function parseM3U(content) {
      const lines = content.split(/\r?\n/);
      const parsed = [];
      let item = null;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;

        if (line.startsWith('#EXTINF:')) {
          item = {
            id: Math.random().toString(36).substring(2, 11),
            name: "Channel",
            group: "General",
            logo: "",
            url: ""
          };

          const groupMatch = line.match(/group-title="([^"]+)"/i);
          if (groupMatch) item.group = groupMatch[1];

          const logoMatch = line.match(/tvg-logo="([^"]+)"/i);
          if (logoMatch) item.logo = logoMatch[1];

          const commaIndex = line.lastIndexOf(',');
          if (commaIndex !== -1) {
            item.name = line.substring(commaIndex + 1).trim();
          }
        } else if (!line.startsWith('#') && item) {
          item.url = line;
          parsed.push(item);
          item = null;
        }
      }
      return parsed;
    }

    // CORS-Safe Playlist Fetcher
    async function fetchAndLoadPlaylist(url) {
      channelsGrid.innerHTML = `
        <div class="loading-indicator" style="grid-column: 1/-1;">
          <i data-lucide="loader-2" class="animate-spin" style="width: 38px; height: 38px; color: var(--accent-cyan);"></i>
          <p>Importing streams from iptv-org...</p>
        </div>
      `;
      lucide.createIcons();

      let text = "";
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error("Direct fetch failed");
        text = await res.text();
      } catch (e) {
        // Transparent proxy fallback if CORS blocks client-side fetch
        try {
          const proxyRes = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`);
          text = await proxyRes.text();
        } catch (proxyError) {
          alert("Failed to load stream playlist. Please import via file upload or paste text.");
          channelsGrid.innerHTML = "";
          return;
        }
      }

      const parsed = parseM3U(text);
      if (parsed.length > 0) {
        channels = parsed;
        localStorage.setItem('aether_channels', JSON.stringify(channels));
        initializeUI();
      } else {
        alert("No valid streams identified in this playlist.");
      }
    }

    function initializeUI() {
      renderCategories();
      renderChannels();
      if (channels.length > 0) {
        playChannel(channels[0]);
      }
    }

    // HLS Stream Player
    function playChannel(channel) {
      activeChannelId = channel.id;
      currentPlayingName.innerText = channel.name;

      if (Hls.isSupported() && (channel.url.includes('.m3u8') || channel.url.includes('m3u'))) {
        if (hls) hls.destroy();
        hls = new Hls({ enableWorker: true, lowLatencyMode: true });
        hls.loadSource(channel.url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
        hls.on(Hls.Events.ERROR, (_, data) => {
          if (data.fatal) {
            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
            else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
            else hls.destroy();
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        // Native Safari HLS
        video.src = channel.url;
        video.play().catch(() => {});
      } else {
        video.src = channel.url;
        video.play().catch(() => {});
      }

      renderChannels();
    }

    // Category Management
    function renderCategories() {
      const categoryMap = {};
      channels.forEach(ch => {
        const g = ch.group || "General";
        categoryMap[g] = (categoryMap[g] || 0) + 1;
      });

      const sortedCategories = Object.keys(categoryMap).sort();
      const groups = [
        { id: "ALL", name: "All Channels", icon: "layout-grid", count: channels.length },
        { id: "FAV", name: "Favorites", icon: "star", count: favorites.size },
        ...sortedCategories.map(c => ({
          id: c,
          name: c,
          icon: "folder",
          count: categoryMap[c]
        }))
      ];

      categoryList.innerHTML = groups.map(g => `
        <li class="category-item ${currentCategory === g.id ? 'active' : ''}" data-cat="${g.id}">
          <div style="display: flex; align-items: center; gap: 0.6rem; overflow: hidden;">
            <i data-lucide="${g.icon}" style="width: 16px; height: 16px; flex-shrink: 0;"></i>
            <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${g.name}</span>
          </div>
          <span class="badge">${g.count}</span>
        </li>
      `).join('');

      lucide.createIcons();

      document.querySelectorAll('.category-item').forEach(el => {
        el.addEventListener('click', () => {
          currentCategory = el.getAttribute('data-cat');
          renderCategories();
          renderChannels();
        });
      });
    }

    // Grid Channels Renderer
    function renderChannels() {
      const query = searchInput.value.toLowerCase();
      let list = channels;

      if (currentCategory === "FAV") {
        list = list.filter(c => favorites.has(c.id));
      } else if (currentCategory !== "ALL") {
        list = list.filter(c => (c.group || "General") === currentCategory);
      }

      if (query) {
        list = list.filter(c => 
          c.name.toLowerCase().includes(query) || 
          (c.group && c.group.toLowerCase().includes(query))
        );
      }

      activeCategoryTitle.innerText = currentCategory === "ALL" ? "All Channels" : currentCategory === "FAV" ? "Favorites" : currentCategory;
      channelCountBadge.innerText = `${list.length} channels`;

      if (list.length === 0) {
        channelsGrid.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; padding: 4rem; color: var(--text-muted);">
            <i data-lucide="video-off" style="width: 44px; height: 44px; margin-bottom: 0.5rem; opacity: 0.4;"></i>
            <p>No channels found.</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      // Cap initial rendering window for swift DOM loading
      const displayChannels = list.slice(0, 150);

      channelsGrid.innerHTML = displayChannels.map(c => {
        const isFav = favorites.has(c.id);
        const isActive = c.id === activeChannelId;
        const logo = c.logo || `https://dummyimage.com/150x150/12141c/00f2fe&text=${encodeURIComponent(c.name.slice(0, 3))}`;

        return `
          <div class="channel-card ${isActive ? 'active' : ''}" data-id="${c.id}">
            <button class="fav-btn ${isFav ? 'active' : ''}" data-fav="${c.id}">
              <i data-lucide="star" style="width: 14px; height: 14px; fill: ${isFav ? 'currentColor' : 'none'}"></i>
            </button>
            <div class="channel-thumb-box">
              <img src="${logo}" alt="${c.name}" onerror="this.src='https://dummyimage.com/150x150/12141c/00f2fe&text=TV'">
            </div>
            <div class="channel-name" title="${c.name}">${c.name}</div>
            <div class="channel-group">${c.group || "General"}</div>
          </div>
        `;
      }).join('');

      lucide.createIcons();

      // Card Click Handler
      document.querySelectorAll('.channel-card').forEach(card => {
        card.addEventListener('click', (e) => {
          if (e.target.closest('.fav-btn')) return;
          const target = channels.find(x => x.id === card.getAttribute('data-id'));
          if (target) playChannel(target);
        });
      });

      // Favorites Toggle
      document.querySelectorAll('.fav-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = btn.getAttribute('data-fav');
          if (favorites.has(id)) favorites.delete(id);
          else favorites.add(id);
          localStorage.setItem('aether_favs', JSON.stringify(Array.from(favorites)));
          renderCategories();
          renderChannels();
        });
      });
    }

    // Search filter
    searchInput.addEventListener('input', renderChannels);

    // Reload iptv-org Default
    document.getElementById('resetIptvOrgBtn').addEventListener('click', () => {
      localStorage.removeItem('aether_channels');
      fetchAndLoadPlaylist(IPTV_ORG_URL);
    });

    // Import Modal Handlers
    const modal = document.getElementById('importModal');
    document.getElementById('openImportBtn').addEventListener('click', () => modal.classList.add('open'));
    document.getElementById('closeModalBtn').addEventListener('click', () => modal.classList.remove('open'));

    document.querySelectorAll('.modal-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.modal-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.getAttribute('data-tab')).classList.add('active');
      });
    });

    function saveAndApply(newChannels) {
      if (!newChannels.length) {
        alert('No valid channels found in the provided payload.');
        return;
      }
      channels = newChannels;
      localStorage.setItem('aether_channels', JSON.stringify(channels));
      modal.classList.remove('open');
      initializeUI();
    }

    // Import via URL
    document.getElementById('loadUrlBtn').addEventListener('click', () => {
      const url = document.getElementById('playlistUrl').value.trim();
      if (url) {
        modal.classList.remove('open');
        fetchAndLoadPlaylist(url);
      }
    });

    // Import via File
    document.getElementById('playlistFile').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => saveAndApply(parseM3U(event.target.result));
      reader.readAsText(file);
    });

    // Import via Paste
    document.getElementById('loadRawBtn').addEventListener('click', () => {
      const text = document.getElementById('playlistRaw').value;
      saveAndApply(parseM3U(text));
    });
  </script>
</body>
</html>
